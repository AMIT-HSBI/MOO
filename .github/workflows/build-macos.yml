name: Build-macOS

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    timeout-minutes: 30
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        setup:
          - { c: "clang", cxx: "clang++", fortran: "gfortran-15", generator: "Ninja" }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          brew install metis libomp ninja

      - name: Configure
        run: |
          OMP_PREFIX=$(brew --prefix libomp)

          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=${{ matrix.setup.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.setup.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.setup.fortran }} \
            -DIPOPT_BUILD_EXAMPLES=ON \
            -DMOO_TESTS=ON \
            -DOpenMP_ROOT="$OMP_PREFIX" \
            -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I$OMP_PREFIX/include" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$OMP_PREFIX/include" \
            -DOpenMP_C_LIB_NAMES="omp" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY="$OMP_PREFIX/lib/libomp.dylib" \
            -G "${{ matrix.setup.generator }}"

      - name: Build
        run: cmake --build build --target install --parallel

      - name: Run test
        run: cmake --build build --target test

      - uses: actions/upload-artifact@v7
        with:
          name: install-macos-${{ matrix.setup.c }}-${{ matrix.setup.generator }}
          path: install/
